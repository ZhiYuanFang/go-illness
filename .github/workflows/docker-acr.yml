# 构建 illness-service 镜像并 push 至阿里云 ACR。
# 触发（仅 tag；develop push 不构建）：
#   git tag v0.0.1 && git push origin v0.0.1
#     → 生产 Environment，tag :v0.0.1 + :<sha>
#   git tag v0.0.2-rc.1 && git push origin v0.0.2-rc.1
#     → 测试 Environment
# 规则：vMAJOR.MINOR.PATCH（无 - 后缀）→ prod；其它 v* 预发布 → test
# 手动：Actions → Run workflow（workflow_dispatch）
#
# ACR 凭证来自 GitHub Actions Secrets / Environments（不读仓库内 .env 文件）：
#   Repository secrets: ACR_USERNAME, ACR_PASSWORD
#   Environment test / prod: REGISTRY（服务器 pull 地址，可用 -vpc 域名）
# CI push 地址由 workflow 从 REGISTRY 去掉 -vpc 自动推导。

name: docker-acr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: 推送目标命名空间
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: 镜像主 tag（须与服务器 .env 中 IMAGE_TAG 一致）
        required: true
        type: string

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.resolve.outputs.deploy_env }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
    steps:
      - name: 解析目标环境与镜像 tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ inputs.target_env }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          resolve_env_from_tag() {
            local tag="$1"
            if [[ ! "${tag}" == v* ]]; then
              echo "::error::tag 须以 v 开头: ${tag}" >&2
              exit 1
            fi
            if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo prod
            else
              echo test
            fi
          }

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_env="${DISPATCH_ENV}"
            primary_tag="${DISPATCH_TAG}"
            if [[ -z "${primary_tag}" ]]; then
              echo "::error::workflow_dispatch 须填写 image_tag" >&2
              exit 1
            fi
            echo "手动触发: env=${deploy_env} tag=${primary_tag}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            primary_tag="${GIT_REF#refs/tags/}"
            deploy_env="$(resolve_env_from_tag "${primary_tag}")"
            echo "tag push: ${primary_tag} → ${deploy_env}"
          else
            echo "::error::不支持的 ref: ${GIT_REF}" >&2
            exit 1
          fi

          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"

  build-push:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.deploy_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 加载 ACR Secrets
        id: acr
        shell: bash
        env:
          DEPLOY_ENV: ${{ needs.resolve-env.outputs.deploy_env }}
          PRIMARY_TAG: ${{ needs.resolve-env.outputs.primary_tag }}
          REGISTRY_PULL: ${{ secrets.REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${REGISTRY_PULL}" ]]; then
            echo "::error title=缺少 REGISTRY::请在 GitHub Environment '${DEPLOY_ENV}' 配置 secret REGISTRY"
            exit 1
          fi
          if [[ -z "${ACR_USERNAME}" ]]; then
            echo "::error title=缺少 ACR_USERNAME::请在 Repository secrets 配置 ACR_USERNAME"
            exit 1
          fi
          if [[ -z "${ACR_PASSWORD}" ]]; then
            echo "::error title=缺少 ACR_PASSWORD::请在 Repository secrets 配置 ACR_PASSWORD"
            exit 1
          fi

          registry_push="${REGISTRY_PULL/-vpc./.}"
          if [[ "${registry_push}" == *"-vpc."* ]]; then
            echo "::error::REGISTRY 仍含 -vpc，公网 runner 无法 push"
            exit 1
          fi
          if [[ "${registry_push}" != *"/"* ]]; then
            echo "::error::REGISTRY 格式须为 <域名>/<命名空间>"
            exit 1
          fi

          echo "::add-mask::${ACR_PASSWORD}"
          echo "env=${DEPLOY_ENV}" >> "${GITHUB_OUTPUT}"
          echo "registry=${registry_push}" >> "${GITHUB_OUTPUT}"
          echo "host=${registry_push%%/*}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"
          echo "username=${ACR_USERNAME}" >> "${GITHUB_OUTPUT}"
          echo "password=${ACR_PASSWORD}" >> "${GITHUB_OUTPUT}"

      - name: 解析镜像 tag
        id: tags
        shell: bash
        env:
          ACR_REGISTRY: ${{ steps.acr.outputs.registry }}
          PRIMARY_TAG: ${{ steps.acr.outputs.primary_tag }}
        run: |
          set -euo pipefail
          image="${ACR_REGISTRY}/illness-service"
          {
            echo "list<<EOF"
            echo "${image}:${PRIMARY_TAG}"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.host }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manifest/docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}

      - name: 构建摘要
        shell: bash
        run: |
          echo "illness-service → [${{ steps.acr.outputs.env }}] ${{ steps.acr.outputs.registry }}:${{ steps.acr.outputs.primary_tag }} (+ ${GITHUB_SHA})"
